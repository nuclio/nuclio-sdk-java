plugins {
    id 'java'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

version = '1.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

base {
    archivesName = 'nuclio-sdk'
}

test {
    useJUnitPlatform()
}

dependencies {
    testImplementation(
        'org.junit.jupiter:junit-jupiter-api:5.8.2'
    )
    testRuntimeOnly(
        'org.junit.jupiter:junit-jupiter-engine:5.8.2',
        'org.junit.platform:junit-platform-launcher',
    )
}

repositories {
    mavenCentral()
}

jar {
    manifest {
        attributes 'Implementation-Title': 'nuclio-sdk',
                   'Implementation-Version': version,
                   'Implementation-Vendor': 'io.nuclio'
    }
}

// Publishes to Maven Central via the Central Portal. Sources and javadoc jars
// are added automatically, and every artifact (including the POM) is signed.
// Credentials come from the mavenCentralUsername / mavenCentralPassword Gradle
// properties; signing uses the standard signing.* properties or
// signingInMemoryKey / signingInMemoryKeyPassword.
mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates('io.nuclio', 'nuclio-sdk-java', version.toString())

    pom {
        name = 'Nuclio Java SDK'
        description = 'Nuclio Java SDK'
        url = 'https://github.com/nuclio/nuclio-sdk-java'
        organization {
            name = 'io.nuclio'
            url = 'https://github.com/nuclio'
        }
        issueManagement {
            system = 'GitHub'
            url = 'https://github.com/nuclio/nuclio-sdk-java'
        }
        licenses {
            license {
                name = 'Apache License 2.0'
                url = 'https://github.com/nuclio/nuclio-sdk-java/blob/master/LICENSE'
                distribution = 'repo'
            }
        }
        scm {
            url = 'https://github.com/nuclio/nuclio-sdk-java'
            connection = 'scm:git:git://github.com/nuclio/nuclio-sdk-java.git'
            developerConnection = 'scm:git:git@github.com:nuclio/nuclio-sdk-java.git'
        }
        developers {
            developer {
                name = 'Gal Topper'
            }
        }
    }
}

// Signing is mandatory for Maven Central, optional for local publishes.
signing {
    setRequired { gradle.taskGraph.allTasks.any { it.name.contains('MavenCentral') } }
}
